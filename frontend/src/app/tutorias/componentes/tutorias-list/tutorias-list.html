<div class="card border-0 shadow-sm">
    <div class="card-body">

        <!-- YA NO NECESITAMOS EL BOTÓN AQUÍ, LO HACE EL HEADER + FAB -->

        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 10rem;">📘 Materia</th>
                        <th>📝 Título</th>
                        <th style="width: 12rem;">👤 Tutor</th>
                        <th style="width: 12rem;">⏰ Horario</th>
                        <th style="width: 12rem;">🏫 Aula / Modalidad</th>
                        <th style="width: 8rem;">🎟️ Cupo</th>
                        <th style="width: 12rem;" class="text-end">⚙️ Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let t of tutorias">
                        <td>
                            <span class="badge bg-light text-dark border tc-badge-materia">
                {{ t.codigoMateria }}
              </span>
                        </td>
                        <td class="fw-semibold">{{ t.titulo }}</td>
                        <td>{{ t.tutorNombre }}</td>
                        <td>{{ t.horaInicio | timeRange:t.horaFin }}</td>
                        <td>
                            <div class="small">
                                {{ t.aula }} ·
                                <span class="text-muted">{{ t.modalidad | modalidadLabel }}</span>
                            </div>
                        </td>
                        <td>{{ t.cupoMaximo }}</td>
                        <td class="text-end">
                            <div class="btn-group">
                                <button class="btn btn-outline-primary btn-sm rounded-pill px-3" (click)="edit.emit(t)" [disabled]="!canEdit">
                  ✏️ Editar
                </button>
                                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="remove.emit(t)" [disabled]="!canEdit">
                  🗑️ Eliminar
                </button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="!tutorias.length">
                        <td colspan="7" class="text-center text-muted py-4">
                            No hay tutorías registradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
