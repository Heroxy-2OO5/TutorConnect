<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h5 class="card-title mb-3">{{ mode === 'crear' ? 'Añadir materia' : 'Editar materia' }}</h5>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" formControlName="codigo" placeholder="mt-3, prog-1, etc.">
                    <div class="form-text text-danger" *ngIf="form.controls['codigo'].touched && form.controls['codigo'].errors?.['hardRequired']">
                        El código es obligatorio.
                    </div>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre de la materia">
                    <div class="form-text text-danger" *ngIf="form.controls['nombre'].touched && form.controls['nombre'].errors?.['hardRequired']">
                        El nombre es obligatorio.
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Semestre</label>
                    <input type="number" class="form-control" formControlName="semestre" min="1" max="10">
                    <div class="form-text text-danger" *ngIf="form.controls['semestre'].touched && form.controls['semestre'].errors">
                        Debe ser un número entre 1 y 10.
                    </div>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" formControlName="descripcion" rows="2" placeholder="Breve descripción"></textarea>
                    <div class="form-text text-danger" *ngIf="form.controls['descripcion'].touched && form.controls['descripcion'].errors?.['hardRequired']">
                        La descripción es obligatoria.
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-success" [disabled]="!canEdit">
          {{ mode === 'crear' ? 'Guardar' : 'Actualizar' }}
        </button>
                <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
